<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵瞳智维 IntelliOps</title>
<style>
:root{--bg:#07101e;--panel:#0d192b;--panel2:#111f34;--line:#22334c;--text:#e8f0ff;--muted:#8ea1be;--cyan:#21d4fd;--blue:#5983ff;--green:#3ddc97;--orange:#ffb84d;--red:#ff647c;--purple:#b084ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#13264b 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:rgba(7,16,30,.86);position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;letter-spacing:.5px}.brand b{color:var(--cyan)}.sub{color:var(--muted);font-size:12px}.runtime{margin:20px 0;padding:12px;border:1px solid #2d4770;background:#10223c;border-radius:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:7px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;text-align:left;border-radius:9px;cursor:pointer}.nav button.on,.nav button:hover{background:#13243c;color:#fff}.main{padding:26px 30px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.title{font-size:25px;font-weight:800}.actions{display:flex;gap:9px;flex-wrap:wrap}button,.btn{border:1px solid #365074;background:#172943;color:#eaf2ff;padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{border-color:var(--cyan)}button.primary{border:0;background:linear-gradient(90deg,#2673ff,#15b8e6);font-weight:700}button.danger{border-color:#6d3040;color:#ff97a7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:linear-gradient(145deg,rgba(18,32,54,.98),rgba(11,23,40,.98));border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 30px #0003}.card h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 9px}.big{font-size:28px;font-weight:800}.cyan{color:var(--cyan)}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.purple{color:var(--purple)}.section{margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px}.tag{font-size:11px;border:1px solid #3a5277;padding:3px 7px;border-radius:999px;display:inline-block}.tag.ok{color:var(--green);border-color:#276248}.tag.wait{color:var(--orange);border-color:#6a5130}.tag.bad{color:var(--red);border-color:#6c3440}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.node{padding:14px;border:1px solid var(--line);border-radius:10px;background:#0c182a}.node.done{border-color:#28674e}.node.run{border-color:#7a5b28;box-shadow:0 0 0 1px #ffb84d33}.timeline{border-left:2px solid #2e4465;margin-left:7px;padding-left:18px}.tl{position:relative;margin:13px 0}.tl:before{content:"";position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue)}pre{white-space:pre-wrap;word-break:break-word;background:#07111f;border:1px solid var(--line);border-radius:9px;padding:12px;color:#bad0ef;max-height:380px;overflow:auto}.empty{padding:38px;text-align:center;color:var(--muted)}select,input,textarea{background:#081526;border:1px solid #314968;color:#fff;padding:9px;border-radius:7px}.notice{border-left:3px solid var(--orange);background:#2b2115;padding:11px 13px;border-radius:6px;color:#ffd895}.success{border-left-color:var(--green);background:#14271f;color:#b8f6d7}.error{border-left-color:var(--red);background:#2c1720;color:#ffbac5}.spinner{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.45}}#toast{position:fixed;right:24px;bottom:24px;background:#172b48;border:1px solid #3c5b82;border-radius:9px;padding:11px 16px;opacity:0;transition:.2s;pointer-events:none}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}.muted{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0}.nav{grid-template-columns:repeat(3,1fr)}.main{padding:18px}.grid,.grid2,.flow{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.grid2,.flow{grid-template-columns:1fr}}
</style>
<style>.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.formgrid label{display:grid;gap:5px;color:var(--muted);font-size:12px}.formgrid input,.formgrid select{width:100%}.wide{grid-column:1/-1}.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.target{border-left:3px solid var(--line)}.target.healthy{border-left-color:var(--green)}.target.unhealthy{border-left-color:var(--red)}.target.pending,.target.unavailable{border-left-color:var(--orange)}@media(max-width:800px){.formgrid{grid-template-columns:1fr}}</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">灵瞳<b>智维</b></div><div class="sub">IntelliOps Desktop v13.1</div><div class="runtime"><div><span class="dot"></span>监控引擎运行中</div><div class="sub" id="runtimeText">embedded-compatible</div></div><div class="nav" id="nav"></div><div class="runtime" onclick="showAISettings()" style="cursor:pointer;text-align:center" title="配置AI Key"><div>🤖 AI 配置 (v13.1)</div><div class="sub" id="aiStatusBar">点击配置 DeepSeek / OpenAI Key</div></div><div class="runtime" style="text-align:center;margin-top:8px"><div>🖥️ 桌面模式</div><div class="sub" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><a href="#" onclick="event.preventDefault();startTray()" style="color:#21d4fd">📌托盘</a> <a href="#" onclick="event.preventDefault();toggleAutoStart()" style="color:#21d4fd">⚡自启</a> <a href="#" onclick="event.preventDefault();testNotify()" style="color:#8ea1be">🔔通知</a> <a href="#" onclick="event.preventDefault();shutdownApp()" style="color:#ff647c">⏻退出</a></div></div></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">运行总览</div><div class="sub" id="pageSub">监控数据来自本机和配置目标的真实探测</div></div><div class="actions"><button onclick="refresh()">立即刷新</button><button class="primary" onclick="go('monitoring')">添加监控</button></div></div><div id="content"><div class="empty spinner">正在读取后端数据…</div></div></main></div><div id="toast"></div>
<script>
'use strict';
const API='/api';let page=new URLSearchParams(location.search).get('page')||'dashboard',selected='',cache={};
const pages=[['dashboard','运行总览'],['apps','应用监控'],['monitoring','监控目标'],['incidents','异常事件'],['approvals','人工审批'],['trace','Agent Trace'],['debate','智能辩论'],['tree','决策树'],['predict','预测告警'],['skills','Skill Runs'],['sageruns','Sage复盘'],['agentteams','AgentTeams'],['evaluation','评测中心'],['demo','故障演练'],['runtime','运行架构']];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){return v?new Date(v).toLocaleString():'—'}
function badge(s){let c=/SUCCEEDED|resolved|completed|APPROVED/i.test(s)?'ok':/WAIT|PENDING|open|running/i.test(s)?'wait':/FAIL|BLOCK|REJECT/i.test(s)?'bad':'';return '<span class="tag '+c+'">'+esc(s)+'</span>'}
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2400)}
async function req(route,opt){let r=await fetch(API+route,opt);let d=await r.json();if(!r.ok)throw new Error(d.detail||d.message||('HTTP '+r.status));return d}
function nav(){document.getElementById('nav').innerHTML=pages.map(x=>'<button class="'+(page===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function go(p){page=p;nav();render()}
async function refresh(silent){try{let [overview,incidents,approvals,runtime,skills,runs,targets,results,snapshot]=await Promise.all([req('/overview'),req('/incidents'),req('/approvals/history'),req('/runtime'),req('/skills'),req('/skill-runs'),req('/monitor/targets'),req('/monitor/results?limit=100'),req('/monitor/snapshot')]);cache={overview,incidents,approvals,runtime,skills,runs,targets,results,snapshot};if(!selected&&incidents.length)selected=incidents[incidents.length-1].id;document.getElementById('runtimeText').textContent=(overview.monitoring.enabled?'持续监控 · ':'监控已暂停 · ')+targets.filter(x=>x.enabled).length+'个目标';if(page==='monitoring'){updateMonitoringResults()}else if(page!=='apps'&&page!=='debate'&&page!=='tree'&&page!=='predict'&&page!=='trace'&&page!=='skills'&&page!=='sageruns'&&page!=='agentteams'&&page!=='evaluation'&&page!=='runtime'&&page!=='demo'){render()}if(!silent)toast('真实探测数据已刷新')}catch(e){document.getElementById('content').innerHTML='<div class="notice error">无法连接内置后端：'+esc(e.message)+'</div>'}}
function render(){nav();let names=Object.fromEntries(pages);document.getElementById('pageTitle').textContent=names[page];let f={dashboard:dash,apps:appsView,monitoring:monitoringView,demo:demo,incidents:incs,trace:trace,skills:skillView,approvals:approvalView,runtime:runtimeView,sageruns:sageView,agentteams:agentteamsView,evaluation:evaluationView,debate:debateView,tree:treeView,predict:predictView}[page];if(f)f()}
function card(t,v,c,sub){return '<div class="card"><h3>'+esc(t)+'</h3><div class="big '+(c||'')+'">'+esc(v)+'</div><div class="sub">'+esc(sub||'')+'</div></div>'}
function dash(){let o=cache.overview;if(!o)return;let c=o.counts,l=o.latest_incident,s=cache.snapshot||{},bad=(cache.targets||[]).filter(x=>x.enabled&&x.status==='unhealthy');document.getElementById('pageSub').textContent='真实持续探测 · 后端唯一数据源 · '+fmt(o.generated_at);document.getElementById('content').innerHTML='<div class="grid">'+card('监控目标',c.monitor_enabled,'cyan',c.monitor_healthy+'健康 · '+c.monitor_unhealthy+'异常')+card('本机CPU',s.cpu_percent==null?'—':s.cpu_percent+'%',s.cpu_percent>=90?'red':'green',s.cpu_count+'个逻辑处理器')+card('本机内存',s.memory_percent==null?'—':s.memory_percent+'%',s.memory_percent>=90?'red':'green',(s.memory_used_gb||0)+' / '+(s.memory_total_gb||0)+' GB')+card('数据盘占用',s.disk_percent==null?'—':s.disk_percent+'%',s.disk_percent>=95?'red':'green','真实文件系统采样')+'</div>'+(bad.length?'<div class="notice error section"><b>当前异常目标</b><br>'+bad.map(x=>esc(x.name)+'：'+esc(x.last_result&&x.last_result.reason||'等待探测')).join('<br>')+'</div>':'<div class="notice success section"><b>当前没有已确认的监控异常</b><br>异常需达到每个目标配置的连续失败次数才会创建事件。</div>')+'<div class="grid2 section"><div class="card"><h3>最新异常事件</h3>'+(l?'<div class="big" style="font-size:19px">'+esc(l.title)+'</div><p>'+badge(l.status)+' · '+esc(l.source)+' · '+fmt(l.created_at)+'</p><button onclick="selected=\''+esc(l.id)+'\';go(\'trace\')">查看证据与处置</button>':'<div class="empty">尚无事件</div>')+'</div><div class="card"><h3>监控引擎</h3><p><b>'+(o.monitoring.enabled?'运行中':'已暂停')+'</b></p><p class="sub">HTTP、TCP、进程、Windows服务与本机资源；探测结果持久化，连续失败去抖。</p><button onclick="go(\'monitoring\')">管理监控目标</button></div></div>'}
function targetAddress(t){if(t.type==='http')return t.config.url;if(t.type==='tcp')return t.config.host+':'+t.config.port;if(t.type==='process'||t.type==='application')return t.config.process_name;if(t.type==='windows_service')return t.config.service_name;return 'CPU / 内存 / 数据盘'}
function targetReason(t){if(!t.last_result)return'尚未探测';var r=t.last_result.reason;if((t.type==='process'||t.type==='application')&&t.status==='unhealthy')return'⚠️ 进程未运行 — 请手动启动 '+t.config.process_name;if(t.type==='windows_service'&&t.status==='unhealthy')return'⚠️ 服务已停止 — 请检查服务状态或审批启动';return r}
function monitorFields(){let t=document.getElementById('mType').value,e=document.getElementById('dynamicFields');let h=t==='http'?'<label class="wide">URL<input id="mAddress" placeholder="https://example.com/health"></label><label>最大延迟(ms)<input id="mLatency" type="number" value="3000"></label>':t==='tcp'?'<label>主机/IP<input id="mAddress" placeholder="127.0.0.1"></label><label>端口<input id="mPort" type="number" placeholder="5432"></label>':t==='process'?'<label class="wide">进程名<input id="mAddress" placeholder="my-service.exe"></label>':t==='application'?'<label class="wide">应用进程名<input id="mAddress" placeholder="steam.exe"></label><label>内存上限(MB)<input id="mMemLimit" type="number" min="1" max="65536" value="2048"></label><label>最小运行时间(分钟)<input id="mMinUptime" type="number" min="0" value="0"></label>':t==='windows_service'?'<label>服务名<input id="mAddress" placeholder="Spooler"></label><label>恢复策略<select id="mRecovery"><option value="none">仅告警</option><option value="start_with_approval">审批后启动服务</option></select></label>':'<div class="wide notice">本机资源目标已经内置；请直接调整或停用默认目标。</div>';e.innerHTML=h}
function monitoringView(){let a=cache.targets||[],on=cache.overview&&cache.overview.monitoring.enabled;document.getElementById('pageSub').textContent='持续探测、连续失败去抖、真实恢复确认；不执行任意Shell';document.getElementById('content').innerHTML='<div class="actions"><button class="'+(on?'danger':'primary')+'" onclick="toggleEngine('+(on?'false':'true')+')">'+(on?'暂停全部监控':'恢复全部监控')+'</button></div><div class="grid2 section">'+a.map(t=>'<div class="card target '+esc(t.status)+'"><div class="statusline"><b>'+esc(t.name)+'</b>'+badge(t.status)+(t.enabled?'':'<span class="tag">已停用</span>')+'</div><p class="mono">'+esc(t.type)+' · '+esc(targetAddress(t))+'</p><p>'+esc(targetReason(t))+'</p><p class="sub">每'+esc(t.interval_sec)+'秒 · 连续'+esc(t.consecutive_failures)+'次失败触发 · 上次 '+fmt(t.last_check_at)+'</p><div class="actions"><button onclick="checkTarget(\''+t.id+'\')">立即探测</button><button onclick="toggleTarget(\''+t.id+'\')">'+(t.enabled?'停用':'启用')+'</button>'+(t.id==='monitor_local_system'?'':'<button class="danger" onclick="deleteTarget(\''+t.id+'\')">删除</button>')+'</div></div>').join('')+'</div><div class="card section"><h3>新增真实监控目标</h3><div class="formgrid"><label>名称<input id="mName" placeholder="支付API健康检查"></label><label>类型<select id="mType" onchange="monitorFields()"><option value="http">HTTP接口</option><option value="tcp">TCP端口</option><option value="process">关键进程</option><option value="application">应用深度监控</option><option value="windows_service">Windows服务</option></select></label><label>探测间隔(秒)<input id="mInterval" type="number" min="5" value="30"></label><label>超时(ms)<input id="mTimeout" type="number" min="500" value="5000"></label><label>连续失败次数<input id="mFailures" type="number" min="1" value="3"></label><div></div><div id="dynamicFields" class="wide formgrid"></div></div><div class="actions section"><button class="primary" onclick="addTarget()">保存并首次探测</button></div></div><div class="card section"><h3>最近真实探测</h3><table class="table"><thead><tr><th>时间</th><th>目标</th><th>结果</th><th>耗时</th><th>证据来源</th></tr></thead><tbody>'+(cache.results||[]).slice().reverse().slice(0,30).map(r=>'<tr><td>'+fmt(r.checked_at)+'</td><td>'+esc(r.target_name)+'</td><td>'+badge(r.status)+'<div class="sub">'+esc(r.reason)+'</div></td><td>'+esc(r.duration_ms)+'ms</td><td class="mono">'+esc(r.source)+'</td></tr>').join('')+'</tbody></table></div>';monitorFields()}
async function addTarget(){try{let type=document.getElementById('mType').value,config={},thresholds={};if(type==='http'){config.url=document.getElementById('mAddress').value;thresholds.latency_ms=Number(document.getElementById('mLatency').value)}if(type==='tcp'){config.host=document.getElementById('mAddress').value;config.port=Number(document.getElementById('mPort').value)}if(type==='process')config.process_name=document.getElementById('mAddress').value;if(type==='application'){config.process_name=document.getElementById('mAddress').value;thresholds.mem_mb=Number(document.getElementById('mMemLimit').value);thresholds.min_uptime_min=Number(document.getElementById('mMinUptime').value)}if(type==='windows_service'){config.service_name=document.getElementById('mAddress').value;config.recovery_action=document.getElementById('mRecovery').value}await req('/monitor/targets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('mName').value,type,interval_sec:Number(document.getElementById('mInterval').value),timeout_ms:Number(document.getElementById('mTimeout').value),consecutive_failures:Number(document.getElementById('mFailures').value),config,thresholds})});toast('监控目标已保存并开始首次探测');await refresh(true)}catch(e){toast(e.message)}}
async function checkTarget(id){try{let d=await req('/monitor/targets/'+id+'/check',{method:'POST'});toast((d.ok?'探测正常：':'探测异常：')+d.reason);await refresh(true)}catch(e){toast(e.message)}}
async function toggleTarget(id){try{await req('/monitor/targets/'+id+'/toggle',{method:'POST'});await refresh(true);render()}catch(e){toast(e.message)}}
async function deleteTarget(id){if(!confirm('删除该监控目标？历史探测记录仍保留。'))return;try{await req('/monitor/targets/'+id,{method:'DELETE'});await refresh(true);render()}catch(e){toast(e.message)}}
function updateMonitoringResults(){try{let a=cache.targets||[],r=(cache.results||[]).slice().reverse().slice(0,30);let cards=document.getElementById('monitorCards');if(cards){cards.innerHTML=a.map(t=>'<div class="card target '+esc(t.status)+'"><div class="statusline"><b>'+esc(t.name)+'</b>'+badge(t.status)+(t.enabled?'':'<span class="tag">已停用</span>')+'</div><p class="mono">'+esc(t.type)+' · '+esc(targetAddress(t))+'</p><p>'+esc(targetReason(t))+'</p><p class="sub">每'+esc(t.interval_sec)+'秒 · 连续'+esc(t.consecutive_failures)+'次失败触发 · 上次 '+fmt(t.last_check_at)+'</p></div>').join('')}let tbl=document.getElementById('monitorTable');if(tbl){tbl.innerHTML=r.map(x=>'<tr><td>'+fmt(x.checked_at)+'</td><td>'+esc(x.target_name)+'</td><td>'+badge(x.status)+'<div class="sub">'+esc(x.reason)+'</div></td><td>'+esc(x.duration_ms)+'ms</td><td class="mono">'+esc(x.source)+'</td></tr>').join('')}}catch(e){}}
async function startDemo(){try{let d=await req('/demo/connection-pool',{method:'POST'});selected=d.incident_id;page='demo';toast('真实并发故障已注入');await refresh(true)}catch(e){toast(e.message)}}
function demo(){let list=cache.incidents||[],i=list.find(x=>x.id===selected&&x.source==='competition_sandbox')||list.filter(x=>x.source==='competition_sandbox').at(-1);document.getElementById('pageSub').textContent='与生产监控隔离的内置故障演练：真实请求 → 取证 → 回滚 → 审批 → 验证';if(!i){document.getElementById('content').innerHTML='<div class="notice">故障演练仅用于培训、比赛验收和Runbook验证，不作为生产监控结果。</div><div class="card empty section"><p>尚未运行连接池演练。</p><button class="primary" onclick="startDemo()">启动隔离的连接池故障闭环</button></div>';return}selected=i.id;let a=cache.approvals.find(x=>x.event_id===i.id&&x.status==='PENDING');document.getElementById('content').innerHTML='<div class="notice"><b>隔离演练环境</b>：以下数据来自APP内置支付沙箱，不冒充外部生产系统。</div><div class="notice '+(i.status==='resolved'?'success':'')+' section"><strong>'+esc(i.title)+'</strong> · '+badge(i.status)+'<br>事件ID：<span class="mono">'+esc(i.id)+'</span></div><div class="flow section"><div class="node done"><b>Commander</b><div class="sub">真实告警聚合</div></div><div class="node '+(/diagnosed|waiting|resolved/.test(i.status)?'done':'run')+'"><b>Detective</b><div class="sub">3个Skill并行取证</div></div><div class="node '+(i.status==='waiting_approval'?'run':i.status==='resolved'?'done':'')+'"><b>Ranger</b><div class="sub">验证、回滚、审批</div></div><div class="node '+(i.status==='resolved'?'done':'')+'"><b>Sage</b><div class="sub">证据化复盘</div></div></div>'+(a?'<div class="card section"><h3>流程已真实暂停：等待L3审批</h3><p>'+esc(a.operation)+'</p><p class="sub">回滚记录已完成，批准后仅恢复Ranger方案B。</p><button class="primary" onclick="approve(\''+a.id+'\')">批准方案B并恢复</button> <button onclick="reject(\''+a.id+'\')">拒绝</button></div>':'')+'<div class="actions section"><button onclick="go(\'trace\')">查看Trace</button><button onclick="downloadEvidence()">导出证据包JSON</button><a class="btn" href="'+API+'/incidents/'+encodeURIComponent(i.id)+'/metrics.csv" download>导出指标CSV</a></div><div id="demoEvidence" class="section"><div class="empty spinner">加载本次运行证据…</div></div>';loadDemoEvidence(i.id)}

function appsView(){document.getElementById('pageSub').textContent='应用深度监控：进程状态、PID、内存和运行时长均来自本机真实探测';document.getElementById('content').innerHTML='<div class="empty spinner">正在读取应用监控数据…</div>';req('/apps').then(d=>{if(page!=='apps')return;let apps=d.apps||[],healthy=apps.filter(a=>a.status==='healthy').length,abnormal=apps.filter(a=>!['healthy','pending'].includes(a.status)).length;let h='<div class="grid">'+card('监控应用',apps.length,'cyan','进程级监控')+card('健康',healthy,'green','运行正常')+card('异常',abnormal,'red','需要关注')+card('待探测',apps.filter(a=>a.status==='pending').length,'orange','等待首次采集')+'</div>';if(apps.length){h+='<div class="grid2 section">'+apps.map(a=>'<div class="card target '+esc(a.status)+'"><div class="statusline"><b>'+esc(a.name)+'</b>'+badge(a.status)+'</div><p class="mono">'+esc(a.process)+' · PID '+esc(a.pid||'—')+'</p><p>内存：'+esc(a.mem_mb==null?'—':a.mem_mb+' MB')+' · 线程：'+esc(a.threads==null?'—':a.threads)+' · 运行：'+esc(a.uptime_min==null?'—':a.uptime_min+' 分钟')+'</p><p class="sub">上次探测：'+fmt(a.last_check)+'</p></div>').join('')+'</div>'}else{h+='<div class="card empty section"><p>暂无应用监控目标</p><button class="primary" onclick="go(\'monitoring\')">添加应用监控</button></div>'}document.getElementById('content').innerHTML=h}).catch(e=>{document.getElementById('content').innerHTML='<div class="notice error">应用数据加载失败：'+esc(e.message)+'<br><button onclick="appsView()">重试</button></div>'})}
async function predictView(){document.getElementById('pageSub').textContent='基于趋势分析的预测性告警：不等同于传统阈值告警，提前预警潜在问题';document.getElementById('content').innerHTML='<div class="empty spinner">分析历史趋势…</div>';try{let d=await req('/predictive');if(page!=='predict')return;let h='<div class="notice"><b>预测引擎</b>：分析最近'+d.sample_count+'条采样数据，检测单调上升趋势</div>';if(d.predictions.length){h+='<div class="grid section">'+d.predictions.map(p=>'<div class="card node '+(p.severity==='warning'?'run':'')+'"><b>⚠️ '+esc(p.metric)+'</b><p>当前：'+esc(p.current)+' · 趋势：'+esc(p.trend)+'</p><p class="sub">预计'+(p.estimated_90pct_in_minutes||'?')+'分钟后达90%</p><p>'+esc(p.advice)+'</p></div>').join('')+'</div>'}else{h+='<div class="card empty"><p>✅ 当前无预测性告警</p><p class="sub">所有指标趋势正常，未检测到持续上升模式</p></div>'}h+='<div class="card section"><h3>预测方法说明</h3><p>基于最近10个采样点的趋势分析。当指标连续10次单调上升且超过阈值时触发预测告警。</p><p class="sub">这不等同于传统阈值告警——传统告警是"已经超了"，预测告警是"即将超了"。这是你APP的独特能力。</p></div>';document.getElementById('content').innerHTML=h}catch(e){document.getElementById('content').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function evaluationView(){document.getElementById('pageSub').textContent='40条可重复受控场景；指标由每次真实运行逐条计算，不代表生产环境泛化准确率';document.getElementById('content').innerHTML='<div class="empty spinner">读取评测报告…</div>';req('/evaluation/latest').then(r=>{if(page!=='evaluation')return;if(r.status==='not_run'){document.getElementById('content').innerHTML='<div class="notice">尚未运行评测。数据集包含40条确定性受控案例，用于回归测试，不冒充真实企业准确率。</div><div class="card empty section"><button class="primary" onclick="runEvaluationNow()">运行40条评测</button></div>';return}let m=r.metrics||{};document.getElementById('content').innerHTML='<div class="notice"><b>真实性说明</b>：'+esc(r.execution_mode)+'；这是受控回归集成绩，不代表未知生产故障的泛化能力。</div><div class="grid section">'+card('场景数',r.scenario_count,'cyan',r.dataset_version)+card('诊断准确率',(m.diagnosis_accuracy*100).toFixed(1)+'%','green','逐案例计算')+card('Runbook准确率',(m.runbook_accuracy*100).toFixed(1)+'%','purple','包含no_match')+card('安全决策准确率',(m.safety_decision_accuracy*100).toFixed(1)+'%','orange','fallback与风险策略')+'</div><div class="actions section"><button class="primary" onclick="runEvaluationNow()">重新运行</button></div><div class="card section"><h3>案例结果</h3><table class="table"><thead><tr><th>ID</th><th>诊断</th><th>Runbook</th><th>安全策略</th><th>置信度</th></tr></thead><tbody>'+r.cases.map(x=>'<tr><td class="mono">'+esc(x.id)+'</td><td>'+badge(x.diagnosis_correct?'SUCCEEDED':'FAILED')+'</td><td>'+badge(x.runbook_correct?'SUCCEEDED':'FAILED')+'</td><td>'+badge(x.safety_correct?'SUCCEEDED':'FAILED')+'</td><td>'+Math.round(x.confidence*100)+'%</td></tr>').join('')+'</tbody></table></div>'}).catch(e=>{document.getElementById('content').innerHTML='<div class="notice error">评测报告加载失败：'+esc(e.message)+'</div>'})}
async function runEvaluationNow(){document.getElementById('content').innerHTML='<div class="empty spinner">正在逐条运行40个场景…</div>';try{await req('/evaluation/run',{method:'POST'});evaluationView()}catch(e){document.getElementById('content').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function runtimeView(){let r=cache.runtime;if(!r)return;document.getElementById('pageSub').textContent='运行模式、安全边界和真实执行能力在APP内公开';document.getElementById('content').innerHTML='<div class="notice"><b>真实性声明</b><br>'+esc(r.statement)+'</div><div class="grid section">'+card('当前模式',r.runtime_mode,'cyan','Windows独立运行')+card('监控能力','6类目标','purple','system/http/tcp/process/service/application')+card('拓扑','1 Manager + '+r.topology.workers.length+' Workers','green','Human-in-the-loop')+card('Skill数量',r.skill_count,'orange','真实可执行并留痕')+'</div><div class="grid2 section"><div class="card"><h3>Manager–Workers</h3><p><b>'+esc(r.topology.manager)+'</b></p>'+r.topology.workers.map(w=>'<div class="node">Worker · '+esc(w)+'</div>').join('')+'</div><div class="card"><h3>安全保证</h3>'+r.guarantees.map(x=>'<p>✓ '+esc(x)+'</p>').join('')+'<p class="sub">仅Windows服务支持审批后启动；不接受任意Shell、脚本或命令文本。</p></div></div><div class="card section"><h3>运行时清单</h3><pre>'+esc(JSON.stringify(r,null,2))+'</pre></div><div class="actions section"><button class="danger" onclick="clearData()">恢复出厂数据</button></div>'}
async function downloadEvidence(){if(!selected)return toast('请先选择事件');try{let d=await req('/incidents/'+encodeURIComponent(selected)+'/evidence');let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='IntelliOps-evidence-'+selected+'.json';a.click();URL.revokeObjectURL(a.href);toast('证据包已导出')}catch(e){toast(e.message)}}
async function clearData(){if(!confirm('确定清空事件、探测历史和自定义监控目标，并恢复默认本机监控？此操作不可撤销。'))return;try{await req('/data/clear',{method:'POST'});selected='';toast('已恢复出厂数据');await refresh(true)}catch(e){toast(e.message)}}
// --- v8.0 Desktop functions ---
async function startTray(){try{let r=await(await fetch(API+'/tray/start',{method:'POST'})).json();toast(r.message||'托盘已启动')}catch(e){toast(e.message)}}
async function toggleAutoStart(){try{let s=await(await fetch(API+'/system/autostart')).json();let r=await(await fetch(API+'/system/autostart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!s.enabled})})).json();toast(r.message)}catch(e){toast(e.message)}}
async function testNotify(){try{await fetch(API+'/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'IntelliOps v13.1',message:'这是一条测试通知，监控系统运行正常'})});toast('通知已发送')}catch(e){toast(e.message)}}
async function shutdownApp(){if(!confirm('确定退出 IntelliOps？监控将停止。'))return;try{await fetch(API+'/shutdown',{method:'POST'});toast('正在关闭...')}catch(e){}}
let aiModal=null;async function showAISettings(){try{let c=await (await fetch(API+'/ai/config')).json();let h=`<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:999" onclick="if(event.target===this)this.remove()"><div style="background:#0d192b;border:1px solid #22334c;border-radius:12px;padding:24px;max-width:460px;width:90%"><h3 style="margin:0 0 16px;color:#21d4fd">🤖 AI 配置 (v13.1)</h3><p style="color:#8ea1be;font-size:13px;margin-bottom:12px">${c.configured?'🟢 AI 已配置 · 模型: '+esc(c.model):'🟡 未配置 · 配置后可AI诊断和AI复盘'}</p><div style="display:grid;gap:10px"><label style="color:#8ea1be;font-size:12px">Endpoint<input id="aiEndpoint" value="${esc(c.endpoint||'https://api.deepseek.com/v1/chat/completions')}" style="width:100%;background:#081526;border:1px solid #314968;color:#fff;padding:9px;border-radius:7px"></label><label style="color:#8ea1be;font-size:12px">API Key<input id="aiKey" type="password" placeholder="sk-..." style="width:100%;background:#081526;border:1px solid #314968;color:#fff;padding:9px;border-radius:7px"></label><label style="color:#8ea1be;font-size:12px">Model<input id="aiModel" value="${esc(c.model)}" style="width:100%;background:#081526;border:1px solid #314968;color:#fff;padding:9px;border-radius:7px"></label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="saveAI()">保存并持久化</button><button onclick="testAI()">测试连接</button><button onclick="document.getElementById(\'aiPanel\').remove()">关闭</button></div><div id="aiResult" style="margin-top:10px;font-size:12px"></div></div></div>`;let d=document.createElement('div');d.id='aiPanel';d.innerHTML=h;document.body.appendChild(d)}catch(e){toast(e.message)}}
async function saveAI(){let d={endpoint:document.getElementById('aiEndpoint').value,api_key:document.getElementById('aiKey').value,model:document.getElementById('aiModel').value};try{let r=await(await fetch(API+'/ai/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();document.getElementById('aiResult').innerHTML=r.configured?'<span style="color:#3ddc97">✅ 已保存，重启后仍然有效</span>':'<span style="color:#ffb84d">⚠️ '+r.message+'</span>';setTimeout(()=>{document.getElementById('aiPanel').remove();toast('AI 配置已生效')},1200)}catch(e){document.getElementById('aiResult').innerHTML='<span style="color:#ff647c">❌ '+e.message+'</span>'}}
async function testAI(){let d={endpoint:document.getElementById('aiEndpoint').value,api_key:document.getElementById('aiKey').value,model:document.getElementById('aiModel').value};document.getElementById('aiResult').innerHTML='<span class="spinner">测试中...</span>';try{let r=await(await fetch(API+'/ai/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();document.getElementById('aiResult').innerHTML=r.status==='ok'?`<span style="color:#3ddc97">✅ ${r.response||'连接成功'}</span>`:`<span style="color:#ff647c">❌ ${r.message}</span>`}catch(e){document.getElementById('aiResult').innerHTML='<span style="color:#ff647c">❌ '+e.message+'</span>'}}
refresh(true);setInterval(()=>refresh(true),2500);
